<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Keranjang Belanja</title>

    <style>
        body{
            font-family:Arial;
            margin:0;
            padding:20px;
            background:#f2f2f2;
        }

        .container{
            display:flex;
            gap:20px;
            flex-wrap:wrap;
        }

        .products{
            flex:3;
            display:grid;
            grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
            gap:20px;
        }

        .card{
            background:white;
            padding:15px;
            border-radius:10px;
            box-shadow:0 0 5px rgba(0,0,0,0.2);
        }

        .card img{
            width:100%;
            border-radius:10px;
        }

        .card h3{
            margin:10px 0;
        }

        .card button{
            padding:10px;
            width:100%;
            border:none;
            background:blue;
            color:white;
            cursor:pointer;
            border-radius:5px;
        }

        .cart{
            flex:1;
            background:white;
            padding:15px;
            border-radius:10px;
            box-shadow:0 0 5px rgba(0,0,0,0.2);
            min-width:250px;
        }

        .cart-item{
            border-bottom:1px solid #ddd;
            padding:10px 0;
        }

        .cart-item button{
            margin:3px;
        }

        .badge{
            background:red;
            color:white;
            padding:2px 8px;
            border-radius:50%;
        }

        .checkout{
            margin-top:15px;
            width:100%;
            padding:10px;
            background:green;
            color:white;
            border:none;
            cursor:pointer;
            border-radius:5px;
        }
    </style>
</head>
<body>

<h1>🛒 Keranjang <span class="badge" id="badge">0</span></h1>

<div class="container">

    <div class="products" id="products"></div>

    <div class="cart">
        <h2>Keranjang Belanja</h2>

        <div id="cart-items"></div>

        <h3>Total: Rp <span id="total">0</span></h3>

        <button class="checkout" id="checkout">
            Checkout
        </button>
    </div>

</div>

<script src="latihan-2.js"></script>

</body>
</html>
